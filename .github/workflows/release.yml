name: release

# Un tag v* (p. ej. v0.1.0) construye la aplicación y publica dist.tar.gz y su .sha256 como release de GitHub.
# xpand descarga ese release con scripts/actualizar-ui.sh.
on:
  push:
    tags:
      - "v*"

# Minimo privilegio: por defecto el token solo lee el repositorio.
permissions:
  contents: read

# Todas las acciones de terceros van fijadas a un SHA de commit; la version queda en el comentario.
jobs:
  # Construye y empaqueta sin token de escritura: el código de dependencias no ve permisos para publicar.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Empaquetar la build (sin mapas, index.html en la raíz)
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          scripts/package-dist.sh apps/local/dist "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            ${{ runner.temp }}/release/dist.tar.gz
            ${{ runner.temp }}/release/dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # Único job con permiso de escritura: solo publica lo que ya construyó el job anterior.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: release
      - name: Extraer las notas de la versión de CHANGELOG.md
        run: |
          awk -v cabecera="## $TAG" '
            $0 == cabecera { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          if [ ! -s "$RUNNER_TEMP/notas.md" ]; then
            echo "::error::CHANGELOG.md no tiene una sección «## $TAG» con contenido"
            exit 1
          fi
      - name: Publicar el release
        working-directory: release
        run: |
          gh release create "$TAG" dist.tar.gz dist.tar.gz.sha256 \
            --verify-tag --notes-file "$RUNNER_TEMP/notas.md"
