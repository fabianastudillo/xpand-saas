name: ci

on:
  push:
  pull_request:

# Minimo privilegio: el token del workflow solo lee el repositorio.
permissions:
  contents: read

# Todas las acciones de terceros van fijadas a un SHA de commit; la version queda en el comentario.
# Dependabot (.github/dependabot.yml) propone las actualizaciones.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @xpand/ide-spa exec playwright install --with-deps chromium
      - run: pnpm e2e

