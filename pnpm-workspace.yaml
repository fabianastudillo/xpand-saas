packages:
  - "packages/*"
  - "apps/*"

# Dependencias cuyos scripts de instalación se permiten (pnpm los bloquea por defecto):
# prisma genera su cliente y motor, sharp y esbuild traen binarios nativos.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  esbuild: true

# postcss: next 15.5 fija 8.4.31 (avisos de seguridad GHSA, parcheados en 8.5.x); se fuerza la versión parcheada.
overrides:
  postcss: "^8.5.32"

# nodemailer: @auth/core 0.41 declara `^7.0.7 || ^8.0.5`, pero todas las versiones hasta la 10.1.3 tienen avisos
# altos sin corregir en 7.x/8.x. Se usa la 10.x (misma API createTransport/sendMail que usa el proveedor de
# Auth.js); la entrada por enlace mágico de las pruebas Playwright lo comprueba.
peerDependencyRules:
  allowedVersions:
    "@auth/core>nodemailer": "10"
    "next-auth>nodemailer": "10"
